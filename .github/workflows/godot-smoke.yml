name: Godot smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Import project and register global classes
        run: godot --headless --editor --path . --quit
      - name: Run core smoke tests
        run: godot --headless --path . --script res://tests/core_smoke.gd
